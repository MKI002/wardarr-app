version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Types follow the Node.js major the image runs on (see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A TypeScript major needs typescript-eslint support first.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Playwright is pinned to the browser build CI installs.
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

name: Feature request
description: Suggest something Wardarr should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Wardarr help?
      description: Your idea of how it could work. Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?

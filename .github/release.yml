# Categories for generated release notes, by pull request label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Services and adapters
      labels: [adapter]
    - title: Translations
      labels: [translation, i18n]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
